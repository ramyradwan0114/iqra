<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F5C4C" />
    <meta name="description" content="تعليم القراءة والكتابة العربية والمصحف التفاعلي" />

    <!-- شاشة كاملة على iOS عند التثبيت -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="اقرأ" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      الـ manifest بيتولّد من vite.config.js عن طريق vite-plugin-pwa،
      والبلجن بيحقن وسم <link rel="manifest"> بنفسه وقت البناء.
      متضيفش link يدوي هنا — اتنين manifest = سلوك مش متوقّع.
    -->

    <!--
      نفس رابط الخطوط بالحرف الموجود في FONT_HREF جوّه App.jsx.
      الكود بيدوّر على link بنفس الـ href قبل ما يضيف واحد، فوجوده هنا
      بيمنع التحميل المزدوج وبيخلّي الخط يبدأ أبكر بدل ما يستنى JS.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&display=swap"
    />

    <!-- الاتصال بمصدر الصوت والتوقيت — بيوفّر وقت أول لمسة -->
    <link rel="preconnect" href="https://api.qurancdn.com" />
    <link rel="preconnect" href="https://download.quranicaudio.com" />

    <title>اقرأ — من أول حرف إلى ورد المصحف</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      هذا التطبيق يحتاج تفعيل JavaScript ليعمل.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
